name: Build Android APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Create debug keystore (CI)
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        run: ./gradlew assembleDebug


      - name: Read app version
        run: |
          echo "APP_VERSION_NAME=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts)" >> $GITHUB_ENV
          echo "APP_VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts)" >> $GITHUB_ENV
          APP_VERSION_NAME=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          APP_VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts)
          if [ -z "$APP_VERSION_NAME" ] || [ -z "$APP_VERSION_CODE" ]; then
            echo "Failed to extract APP_VERSION_NAME/APP_VERSION_CODE from app/build.gradle.kts"
            exit 1
          fi

      - name: Rename APK with app/version
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/MariAsh-Stream-v${APP_VERSION_NAME}+${APP_VERSION_CODE}-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MariAsh-Stream-debug-apk
          path: app/build/outputs/apk/debug/MariAsh-Stream-v${{ env.APP_VERSION_NAME }}+${{ env.APP_VERSION_CODE }}-debug.apk
          if-no-files-found: error

      - name: Publish APK to "latest-apk" release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Latest APK
          prerelease: true
          make_latest: false
          files: app/build/outputs/apk/debug/MariAsh-Stream-v${{ env.APP_VERSION_NAME }}+${{ env.APP_VERSION_CODE }}-debug.apk
          body: |
            Auto-generated from commit ${{ github.sha }}.
            Branch: ${{ github.ref_name }}
